/* HUD */
#hud{position:absolute;left:0;right:0;top:0;height:58px;padding:4px 4px 0;display:flex;gap:3px;align-items:flex-start;
  background:linear-gradient(#0d1220ee,#0d122000)}
.lord{display:flex;align-items:center;gap:3px;padding:0 4px 0 0;height:34px;width:96px}
.lord .face{width:30px;height:30px;border:2px solid #8fa0c4;background:#2d3550;border-radius:3px;image-rendering:pixelated}
.lord .lv{font-size:10px}
.pill{height:20px;border-radius:10px;background:#0b0f1acc;border:1px solid #4a5675;display:flex;align-items:center;gap:2px;padding:0 6px 0 2px;font-size:10px;white-space:nowrap}
.pills{display:grid;grid-template-columns:1fr 1fr;gap:2px;flex:1}
.hbtn{width:30px;height:30px}
.rank{font-size:9px;color:#ffd76a}
.dis{font-size:9px;display:flex;align-items:center;gap:3px}
.dis .bar{width:46px;height:7px}

/* generic */
.title{font-size:16px;text-align:center}
.small{font-size:9px;color:#c9d2e6;font-weight:400}
.gold{color:#ffd23a}.gem{color:#7fd4ff}.red{color:#ff6a5a}.green{color:#8bea6a}.purple{color:#d59aff}
.row{display:flex;align-items:center;gap:4px}
.col{display:flex;flex-direction:column;gap:4px}
.sp{flex:1}
.list{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.list::-webkit-scrollbar{width:3px}.list::-webkit-scrollbar-thumb{background:#5a6688}
.card{background:#1a2133;border:1px solid #3e4a68;border-radius:4px;padding:4px}
.dim{position:absolute;inset:0;background:#0008;display:flex;align-items:center;justify-content:center}
.drawer{position:absolute;left:0;right:0;bottom:78px;height:300px;animation:up .18s ease-out}

@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
.pop{animation:pop .22s ease-out}

.qframe{border:8px solid transparent;border-image-slice:8 fill;border-image-repeat:stretch;image-rendering:pixelated;display:flex;align-items:center;justify-content:center}
.dock{position:absolute;left:4px;right:4px;bottom:4px;height:72px;display:flex;gap:3px}

function spr(name, fw, fh, fr, x, y, o = {}) {
  const i = im(name), s = o.s || 1, dw = fw * s, dh = fh * s;

  const d = (sx, sy, sw, sh, dx, dy, dw, dh) => { if (dw > 0 && dh > 0) ctx.drawImage(i, sx, sy, sw, sh, dx, dy, dw, dh); };

  d(0, ih - b, b, b, x, y + h - b, b, b); d(b, ih - b, cw, b, x + b, y + h - b, mw, b); d(iw - b, ih - b, b, b, x + w - b, y + h - b, b, b);

      up: [520, 1040, .25, 'triangle', .07], gacha: [660, 1320, .35, 'triangle', .07], bad: [220, 160, .2, 'square', .04] }[type];

  const F = fighters();
  F.forEach((h, i) => { const p = heroSlot(i); h._sx = p[0]; h._sy = p[1]; });
  if (!R.mobs.length && !R.raid) { R.waveT -= dt; if (R.waveT <= 0 && F.length) spawnWave(); }
  for (const h of F) {
    h._anim += dt; if (h._lunge > 0) h._lunge -= dt; if (h._flash > 0) h._flash -= dt; if (h._cd > 0) h._cd -= dt;
    if (S.shops.inn.built && !R.raid) h.stam = Math.max(0, h.stam - dt * .45 * (h.tr === 'glutton' ? 1.5 : 1));
    if (h._stun > 0) { h._stun -= dt; continue; }
    const d = dist(h._fx, h._fy, h._sx, h._sy), sp = 75 * (striking() ? .75 : 1);
    if (d > 2) { const k = Math.min(1, sp * dt / d); h._fx += (h._sx - h._fx) * k; h._fy += (h._sy - h._fy) * k; h._moving = true; }
    else h._moving = false;
    h._atk -= dt;

      const t = targetMob(h); if (t) { heroAttack(h, t); h._atk = CLS[h.cls].cd * (striking() ? 1.25 : 1); }
    }
    if (!R.raid) checkLeave(h);

  // 몬스터
  for (const m of R.mobs) {
    m.anim += dt; if (m.flash > 0) m.flash -= dt; if (m.lunge > 0) m.lunge -= dt;
    const d = dist(m.x, m.y, m.sx, m.sy);
    if (d > 2) { const k = Math.min(1, 90 * dt / d); m.x += (m.sx - m.x) * k; m.y += (m.sy - m.y) * k; m.moving = true; continue; }
    m.moving = false; m.atkT -= dt;

      const alive = fighters().filter(h => h._fy < 500);
      if (alive.length) {
        const h = pick(alive); m.lunge = .25; m.atkT = m.cd;
        if (MOBS[m.k].ranged) R.proj.push({ x: m.x - 8, y: m.y - 14, tgt: h, hero: true, dmg: m.atk, spr: 'vfx_magic', sp: 200, filter: 'hue-rotate(160deg)' });
        else hurtHero(h, m.atk * rnd(.85, 1.15));

  for (const p of R.proj) {
    const tx = p.hero ? p.tgt._fx : p.tgt.x, ty = (p.hero ? p.tgt._fy : p.tgt.y) - 14;
    const d = dist(p.x, p.y, tx, ty), k = Math.min(1, p.sp * dt / Math.max(d, .01));
    p.x += (tx - p.x) * k; p.y += (ty - p.y) * k; p.ang = Math.atan2(ty - p.y, tx - p.x);

      if (p.hero) { if (p.tgt.st === 'fight') hurtHero(p.tgt, p.dmg); }

    }

  if (R.bossT > 0 && !R.raid) {
    R.bossT -= dt;
    if (R.bossT <= 0 && R.mobs.some(m => m.boss)) {

      toast('보스 토벌 실패! 대장간에서 무기를 강화하세요', 'red'); sfx('bad');
      log(S.maxStage >= 4 ? '[대장간 공정]에서 고품질 무기를 제작하면 보스를 이길 수 있어요.' : '용사를 더 초빙하거나 레벨을 올려보세요.');
    }
  }

}
function targetMob(h) {

  let best = null, bd = 1e9; for (const m of live) { const d = Math.abs(m.y - h._fy) + Math.abs(m.x - h._fx) * .3; if (d < bd) { bd = d; best = m; } }
  return best;
}
function heroAttack(h, m) {

        12: '온천 건설 가능! 불만도를 크게 낮춰줍니다', 16: '마왕성 정문! 켈베로스 레이드 개방, 용사 정원 12명' }[S.stage];

  if (S.shops.smith.built && h.w.dur <= 0) return goTown(h, '무기 사러 간다!', 'icon_broken');
  if (h.carry >= 14) return goTown(h, '가방이 꽉 찼다!', 'icon_mat');

/* ---------------- 상점가 (용사 AI) ---------------- */
const GATE = [180, 102], FOUNT = [180, 300];
const door = k => [SLOT[k][0], SLOT[k][1] + 8];
function updateTown(dt) {
  for (const k of SHOP_KEYS) R.queue[k] = R.queue[k] || [];
  for (const h of S.heroes) {
    h._anim += dt; if (h._bub) { h._bub.t -= dt; if (h._bub.t <= 0) h._bub = null; }
    if (h.st === 'toTown') { // 사냥터에서 아래로 퇴장
      h._fy += 95 * dt * (striking() ? .75 : 1); h._moving = true;
      if (h._fy >= 600) { h.st = 'town'; h._tx = GATE[0] + rnd(-6, 6); h._ty = GATE[1]; h._cur = null; }
      continue;
    }
    if (h.st !== 'town') continue;
    h.hp = Math.min(maxHp(h), h.hp + maxHp(h) * .01 * dt);
    if (!h._cur) {
      let k = h._err.shift();
      while (k && k !== 'exchange' && h.wallet < (k === 'smith' ? WEAP[curTier()].price * .7 : salePrice(k)) * .9 && !(k === 'smith' && h.w.dur <= 0 && h.wallet >= 30)) k = h._err.shift();
      if (!k && h._err.length === 0 && h.wallet < 60 && !h._broke) { h._broke = 1; bubble(h, '빈털터리… 다시 사냥!', 'icon_angry', 1.6); }
      if (k) h._cur = { k, ph: 'walk' };
      else if (h.hp < maxHp(h) * .5) h._cur = { k: 'rest', ph: 'walk' };
      else h._cur = { k: 'leave', ph: 'walk' };
    }
    const c = h._cur, sp = 62 * (striking() ? .75 : 1) * (passOn() ? 1.4 : 1);
    let tgt;
    if (c.k === 'leave') tgt = GATE; else if (c.k === 'rest') tgt = [FOUNT[0] + (h.id % 5 - 2) * 12, FOUNT[1] + 24];
    else { const q = R.queue[c.k], i = q.indexOf(h); const dd = door(c.k); tgt = i < 0 ? dd : [dd[0] + (i % 2 ? 7 : -7) * (i > 0), dd[1] + i * 11]; }
    const d = dist(h._tx, h._ty, tgt[0], tgt[1]);
    if (d > 1.5) { const kk = Math.min(1, sp * dt / d); h._tx += (tgt[0] - h._tx) * kk; h._ty += (tgt[1] - h._ty) * kk; h._moving = true; h._face = tgt[0] < h._tx ? -1 : 1; }

    if (c.ph === 'queue') {
      const q = R.queue[c.k];
      if (q[0] === h && !h._moving) { c.t -= dt; if (c.t <= 0) { q.shift(); transact(h, c.k); h._cur = null; } }
    }
    if (c.k === 'rest' && !h._moving) { h.hp = Math.min(maxHp(h), h.hp + maxHp(h) * .05 * dt); if (h.hp >= maxHp(h) * .6) h._cur = null; if (Math.random() < dt * .3) bubble(h, '재고 좀 채워줘…', 'icon_angry', 1.5); }
    if (c.k === 'leave' && d < 2) { h.st = 'fight'; h._fx = rnd(60, 140); h._fy = 600; h._cur = null; h._cd = 30; h._broke = 0; }
  }
  // 고블린 알바 자동 보충
  R.gobT = (R.gobT || 0) - dt;
  const workers = passOn() ? 4 : S.goblins;
  if (workers > 0 && R.gobT <= 0) {
    R.gobT = passOn() ? .4 : 5 / workers;
    let best = null, br = 1;
    for (const k of SHOP_KEYS) { const s = S.shops[k], N = SHOPS[k]; if (!s.built || !N.need) continue; const r = s.stock / maxStock(k); if (r < br && S.mat >= N.need) { br = r; best = k; } }
    if (best && (br < .3 || passOn() || workers >= 2)) { S.shops[best].stock++; S.mat -= SHOPS[best].need; R.gobTarget = best; }
  }
  // 고블린 비주얼
  while (R.gobs.length < Math.min(workers, 4)) R.gobs.push({ x: SLOT.exchange[0], y: SLOT.exchange[1] + 10, to: 'potion', carry: true, anim: 0 });
  while (R.gobs.length > Math.min(workers, 4)) R.gobs.pop();

    g.anim += dt; const t = door(g.to), d = dist(g.x, g.y, t[0] + i * 6, t[1] + 14), sp = passOn() ? 90 : 55;
    if (d > 2) { const k = Math.min(1, sp * dt / d); g.x += (t[0] + i * 6 - g.x) * k; g.y += (t[1] + 14 - g.y) * k; g.face = t[0] + i * 6 < g.x ? -1 : 1; }
    else { if (g.to === 'exchange') { g.to = R.gobTarget && R.gobTarget !== 'exchange' ? R.gobTarget : pick(['potion', 'smith', 'inn', 'tavern']); g.carry = true; if (!S.shops[g.to].built) g.to = 'potion'; } else { g.to = 'exchange'; g.carry = false; } }
  });
}
const payTime = () => passOn() ? .3 : S.goblins >= 3 ? .5 : 1.2;
function transact(h, k) {

    bubble(h, `부산물 +${got}`, 'icon_mat', 1.6); floatTxt(x, y - 70, `${ico('icon_mat')}+${got}`, 'mat', 'town'); return;
  }
  if (striking() && Math.random() < .25) { bubble(h, '바가지 반대! 파업!', 'icon_picket'); return; }
  if (sh.stock <= 0 && N.need) { bubble(h, 'SOLD OUT…', 'icon_angry'); S.dis = Math.min(100, S.dis + 3); sfx('bad'); stockAlert(k); return; }
  let q = 1, price;
  if (k === 'smith') {
    if (h.tr === 'luxury') q = rollQ(2); else q = rollQ();
    price = Math.round(WEAP[curTier()].price * QUAL[q].price * sh.mul * priceMul() * (h.tr === 'luxury' ? 2 : 1));
  } else price = salePrice(k);
  if (h.tr === 'rich') price = Math.round(price * 1.5);
  if (k === 'smith' && h.wallet < price && h.tr !== 'luxury') {   // 지갑 사정에 맞춰 품질을 낮춰 구매
    while (q > 0 && h.wallet < price) { q--; price = Math.round(WEAP[curTier()].price * QUAL[q].price * sh.mul * priceMul() * (h.tr === 'rich' ? 1.5 : 1)); }
    if (h.wallet < price && h.w.dur <= 0 && h.wallet >= 30) { q = 0; price = h.wallet; }   // 가진 돈 전부 털어 조잡한 무기라도
  }
  if (h.wallet < price) { bubble(h, '너무 비싸!', 'icon_angry'); if (sh.mul > 1.3) S.dis = Math.min(100, S.dis + 1); return; }
  if (h.tr === 'miser' && k === 'potion' && h.hp > maxHp(h) * .1 && h.hp > 5) { bubble(h, '아직 버틸만해', 'icon_angry', 1.4); return; }
  h.wallet -= price; if (N.need) { sh.stock--; if (sh.stock === 0) stockAlert(k); } gainGold(price); S.sold++;
  R.saleAcc += price; R.saleT = 2.2;
  floatTxt(x, y - 72, `+${fmt(price)}G`, 'receipt', 'town'); sfx('coin');
  const welfare = k === 'tavern' || k === 'spa';
  if (!welfare) S.dis = Math.min(100, S.dis + (sh.mul - 1) * 15 * (priceMul() > 1 ? 1.2 : 1) / 3);
  const M = maxHp(h);
  if (k === 'potion') { h.hp = Math.min(M, h.hp + M * .6); bubble(h, '포션 꿀꺽!', 'icon_potion', 1.4); }
  if (k === 'inn') { h.stam = 100; h.hp = Math.min(M, h.hp + M * .3); bubble(h, '푹 잤다~', 'icon_bed', 1.4); }
  if (k === 'smith') { h.w = { t: curTier(), q, dur: 100 }; bubble(h, `${QUAL[q].n} ${wName(h.cls, curTier())}!`, 'icon_sword', 1.8); }
  if (k === 'tavern') { S.dis = Math.max(0, S.dis - 35); S.buffT = 60; h.stam = Math.min(100, h.stam + 30); bubble(h, '맥주 한 잔!', 'icon_beer', 1.4); }
  if (k === 'spa') { S.dis = Math.max(0, S.dis - (h.tr === 'spa' ? 70 : 35)); S.buffT = 60; h.hp = M; bubble(h, '극락이다~', 'icon_steam', 1.4); }
}

/* ---------------- 메인 업데이트 ---------------- */
function update(dt) {
  R.t += dt;
  if (S.buffT > 0) S.buffT -= dt;
  if (S.passT > 0) S.passT -= dt;
  S.dis = Math.max(0, S.dis - dt * .2);
  if (R.saleT > 0) { R.saleT -= dt; if (R.saleT <= 0) R.saleAcc = 0; }

function build(k) {
  const N = SHOPS[k];
  if (S.maxStage < N.unlock) return toast(`Stage ${N.unlock}에 해금됩니다`, 'red');
  if (S.gold < N.build) return toast('골드가 부족합니다', 'red');
  S.gold -= N.build; S.shops[k].built = true; S.shops[k].stock = N.need ? 5 : 0; sfx('up');
  toast(`${N.n} 건설 완료!`, 'gold'); closeModal(); addFx('vfx_levelup', SLOT[k][0], SLOT[k][1] - 48, 64, 64, { center: 1, s: 2, dur: .7 });
  if (R.drawer === 'build') openBuild();
}
function upgrade(k) {
  const s = S.shops[k];
  if (s.lv >= 10) return;
  if (rank() < lvGate(s.lv)) return toast(`상권 등급 [${RANKS[lvGate(s.lv)]}]이 필요합니다`, 'red');
  const c = upCost(k); if (S.gold < c) return toast('골드가 부족합니다', 'red');
  S.gold -= c; s.lv++; s.stock = Math.min(maxStock(k), s.stock + 5); sfx('up');
  toast(`${SHOPS[k].n} Lv.${s.lv} 증축 완료!`, 'gold');
  addFx('vfx_levelup', SLOT[k][0], SLOT[k][1] - 48, 64, 64, { center: 1, s: 2, dur: .7 });
}
function restock(k) {
  const s = S.shops[k], N = SHOPS[k], n = Math.min(maxStock(k) - s.stock, Math.floor(S.mat / N.need));
  if (s.stock >= maxStock(k)) return toast('재고가 가득 찼습니다');
  if (n <= 0) return toast('부산물이 부족합니다! 용사들이 거래소에 납품해야 합니다', 'red');
  s.stock += n; S.mat -= n * N.need; sfx('coin'); toast(`${N.n} 재고 +${n}`);
}

/* 2. 용사 초빙 */
function gradeProbs(ten) {
  const L = tavernLv();
  let p = L >= 7 ? [40, 33, 18, 7, 2] : L >= 5 ? [45, 35, 15, 5, 0] : L >= 3 ? [55, 35, 10, 0, 0] : [70, 30, 0, 0, 0];
  if (ten) { p = p.slice(); const extra = p[2] + p[3] + p[4]; p[2] *= 2; p[3] *= 2; p[4] *= 2; p[0] -= extra; }
  return p;
}
function rollGrade(ten) { const p = gradeProbs(ten); let r = Math.random() * 100; for (let i = 0; i < 5; i++) { r -= p[i]; if (r < 0) return i; } return 0; }
function rollTrait(ten) { const w = TRAIT_KEYS.map(k => ten && (k === 'rich' || k === 'luxury') ? 3 : 1); let r = Math.random() * w.reduce((a, b) => a + b); for (let i = 0; i < w.length; i++) { r -= w[i]; if (r < 0) return TRAIT_KEYS[i]; } return 'rich'; }
function summon(n, useTicket) {
  if (useTicket) { if (S.tickets < n) return toast('초빙권이 부족합니다', 'red'); S.tickets -= n; }
  else { const c = n === 10 ? 2700 : 300; if (S.gems < c) return toast('보석이 부족합니다', 'red'); S.gems -= c; }
  const res = [];
  for (let i = 0; i < n; i++) {
    let g = rollGrade(n === 10), tr = rollTrait(n === 10), cls = g >= 2 && Math.random() < .4 ? 'knight' : pick(['warrior', 'archer', 'mage', 'rogue']);
    if (n === 10 && i === 9 && !res.some(r => r.cls === 'knight')) { cls = 'knight'; tr = 'rich'; g = Math.max(g, 1); }
    S.summons++;
    res.push(makeHero(cls, g, tr));
  }
  // 빈자리가 부족하면 등급이 높은 용사부터 남기고 나머지는 보석으로 환급
  let free = freeSlots();
  for (const h of res.slice().sort((a, b) => b.g - a.g || (b.cls === 'knight') - (a.cls === 'knight'))) {
    if (free > 0) { addHero(h); h._new = true; free--; } else { h._refund = true; S.gems += REFUND_GEMS; }
  }
  sfx('gacha');
  modal(`<div class="title t gold">초빙 결과</div><div class="small" style="text-align:center">주점 Lv.${tavernLv()} · 누적 ${S.summons}회</div>
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-top:6px">${res.map((h, i) => `
     <div class="card col" style="align-items:center;gap:0;padding:2px;position:relative;border-color:${GRADES[h.g].col}">
       <canvas data-i="${i}" width="32" height="32" style="position:static;width:40px;height:40px"></canvas>
       <span class="gr" style="background:${GRADES[h.g].col}">${GRADES[h.g].k}</span>
       <span style="font-size:7px;white-space:nowrap">${h.name}</span><span data-tr="${h.tr}" style="cursor:pointer">${ico(TRAITS[h.tr].icon)}</span>
       ${h._refund ? '<span class="small red" style="font-size:7px">정원초과</span>' : ''}</div>`).join('')}</div>
    ${res.some(h => h._refund) ? `<div class="small" style="text-align:center">정원 초과 ${res.filter(h => h._refund).length}명은 보석 ${REFUND_GEMS}개씩 환급되었습니다. (특성 아이콘을 누르면 설명)</div>` : ''}`,
    m => { m.querySelectorAll('canvas[data-i]').forEach(c => sprTo(c, CLS[res[c.dataset.i].cls].spr, 32, 32, 0)); bindTraitTaps(m); });
}
function bindTraitTaps(root) { root.querySelectorAll('[data-tr]').forEach(e => e.onclick = ev => { ev.stopPropagation(); const T = TRAITS[e.dataset.tr]; toast(`: ${T.d}`, 'gold', 3); }); }
function confirmSummon(n, ticket) {
  const free = freeSlots();
  if (free >= n) return summon(n, ticket);

let last = performance.now(), uiT = 0, saveT = 0;
function frame(now) {
  let dt = Math.min(.1, (now - last) / 1000); last = now;
  if (!R.paused) {
    let sim = dt * S.speed; while (sim > 0) { const s = Math.min(sim, .05); update(s); sim -= s; }
    R.minuteT = (R.minuteT || 0) + dt;
    if (R.minuteT >= 60) { const a = R.minuteAcc || 0; S.incomePerMin = S.incomePerMin ? S.incomePerMin + (a - S.incomePerMin) * .3 : a; R.minuteT = 0; R.minuteAcc = 0; }
    if (striking() && !R.wasStriking) showStrike();
    R.wasStriking = striking();
  }
  if (R.lockT > 0) R.lockT -= dt;
  ctx.imageSmoothingEnabled = false;
  if (R.scene === 'lobby') renderLobby(); else renderTown();
  uiT -= dt; if (uiT <= 0) { uiT = .1; updHud(); if (R.scene === 'lobby') updLobbyUI(); else updTownUI(); if (R.modalUpd) R.modalUpd(); }
  else updBubbles();
  if (toastT > 0) { toastT -= dt; if (toastT <= 0 && toastEl) toastEl.style.display = 'none'; }
  saveT += dt; if (saveT > 5) { saveT = 0; save(); }
  requestAnimationFrame(frame);
}
