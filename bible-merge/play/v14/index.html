<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>바이블 머지 v1.4 (Unity WebGL)</title>
<style>
  html, body { margin: 0; height: 100%; background: #2d2350; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: grid; place-items: center; }
  #unity-canvas { display: block; background: #cfe5ff; height: 100%; max-height: 100vh; aspect-ratio: 9 / 16; max-width: 100vw; }
  #load { position: fixed; inset: 0; display: grid; place-items: center; color: #fff; font: 600 15px/1.6 "Malgun Gothic", sans-serif; text-align: center; pointer-events: none; }
  #bar { width: 180px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.25); margin: 10px auto 0; overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: #ffd36b; }
</style>
</head>
<body>
<div id="wrap"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
<div id="load"><div>바이블 머지 v1.4 불러오는 중…<div id="bar"><i></i></div></div></div>
<script src="Build/WebGLBuildGz.loader.js"></script>
<script>
  createUnityInstance(document.getElementById('unity-canvas'), {
    dataUrl: 'Build/WebGLBuildGz.data.unityweb',
    frameworkUrl: 'Build/WebGLBuildGz.framework.js.unityweb',
    codeUrl: 'Build/WebGLBuildGz.wasm.unityweb',
    streamingAssetsUrl: 'StreamingAssets',
    companyName: 'BibleMerge', productName: 'BibleMerge', productVersion: '1.4',
  }, p => { document.querySelector('#bar i').style.width = Math.round(p * 100) + '%'; })
  .then(() => { document.getElementById('load').remove(); })
  .catch(m => { document.getElementById('load').textContent = '불러오지 못했습니다: ' + m; });
</script>
</body>
</html>
