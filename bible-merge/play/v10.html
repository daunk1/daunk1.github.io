<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#2d2350">
<title>바이블 머지 v1.0 (팀 HTML5)</title>
<style>:root{
  --ink:#4b3a5a; --ink2:#7a6a8c; --paper:#fff8ec; --paper2:#f6ead6; --gold:#f2b52e; --gold2:#ffd96a;
  --sky:#8fd0f5; --night:#2d2350; --green:#5fb94a; --red:#e0574f;
  --cell:48px; --gap:4px; --stage:150px; --hud:52px; --orders:112px; --info:50px;
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night);color:var(--ink);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
img{-webkit-user-drag:none}

#app{position:relative;margin:0 auto;max-width:520px;height:100%;display:flex;flex-direction:column;
  background:linear-gradient(#3a2d66 0,#2d2350 var(--hud),#f7ecd8 calc(var(--hud) + 1px),#efe0c4 100%)}

/* HUD */
#hud{height:var(--hud);flex:none;display:flex;align-items:center;gap:6px;padding:6px 8px}
.iconbtn{width:40px;height:40px;flex:none;border-radius:12px;background:rgba(255,255,255,.12);display:grid;place-items:center}
.iconbtn img{width:30px;height:30px}
.iconbtn:active{transform:scale(.92)}
.pill{flex:1;min-width:0;height:36px;display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.28);border:2px solid rgba(255,255,255,.18);
  border-radius:20px;padding:0 4px 0 2px;color:#fff;position:relative}
.pill img{width:34px;height:34px;margin-left:-6px;flex:none;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.pilltxt{font-variant-numeric:tabular-nums;white-space:nowrap}
.pilltxt b{font-size:16px;font-weight:800}
.pilltxt small{font-size:11px;opacity:.75}
#mannaTimer{font-size:10px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}
.plus{width:26px;height:26px;border-radius:50%;background:linear-gradient(#8ee36a,#46a63a);color:#fff;font-weight:900;font-size:18px;line-height:24px;
  box-shadow:0 2px 0 #2c7a28;flex:none;margin-left:2px}
.pill.talent{flex:.8}
.bump{animation:bump .35s ease}
@keyframes bump{40%{transform:scale(1.14)}}

/* Stage */
#stage{position:relative;height:var(--stage);flex:none;overflow:hidden;margin:6px 8px 0;border-radius:16px;border:3px solid var(--ink);background:#bfe3f7}
#stage .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#decor{position:absolute;inset:0;pointer-events:none}
#decor img{position:absolute;transition:opacity .6s, transform .6s}
#decor img.hide{opacity:0;transform:scale(.5)}
#decor img.float{animation:floaty 3.2s ease-in-out infinite}
@keyframes floaty{50%{translate:0 -4px}}
#chLabel{position:absolute;left:8px;top:6px;background:rgba(255,248,236,.92);border:2px solid var(--ink);border-radius:12px;padding:2px 9px;font-weight:800;font-size:13px;line-height:1.35}
#chLabel small{display:block;font-weight:600;font-size:10px;color:var(--ink2)}
#chProg{position:absolute;right:8px;top:6px;background:rgba(255,248,236,.92);border:2px solid var(--ink);border-radius:12px;padding:3px 8px;font-weight:800;font-size:12px;display:flex;align-items:center;gap:3px}
#chProg img{width:16px;height:16px}
#boss{position:absolute;display:none;flex-direction:column;align-items:center;justify-content:flex-end}
#boss img{max-width:100%;max-height:100%;min-height:0;flex:1;object-fit:contain;transition:transform .5s, opacity .6s}
#boss .hp{order:2;position:relative;width:76%;max-width:150px;height:14px;border:2px solid var(--ink);background:#fff;border-radius:8px;overflow:hidden;flex:none;margin-top:2px}
#boss .hp i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#ff8a7a,#e0574f);transition:width .35s}
#boss .hp span{position:absolute;inset:0;text-align:center;font-size:10px;line-height:10px;font-weight:800}
#boss.target img{filter:drop-shadow(0 0 10px #fff6a0) drop-shadow(0 0 4px #fff)}
#boss.dead .hp{visibility:hidden}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px) rotate(-2deg)}40%{transform:translateX(5px) rotate(2deg)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
#rainbow{position:absolute;left:5%;width:90%;top:8%;opacity:0;transition:opacity 1.2s;pointer-events:none}
#rainbow.on{opacity:.9}

/* Orders */
#orders{height:var(--orders);flex:none;display:flex;gap:6px;padding:6px 8px 0}
.order{flex:1 1 0;min-width:0;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:5px 6px 5px;display:flex;flex-direction:column;
  position:relative;box-shadow:0 3px 0 rgba(75,58,90,.25);transition:transform .15s}
.order.empty{background:rgba(255,255,255,.35);border-style:dashed;border-color:rgba(75,58,90,.35);box-shadow:none;align-items:center;justify-content:center;color:var(--ink2);font-size:11px;text-align:center}
.order .oh{display:flex;align-items:center;gap:4px;min-width:0}
.order .face{width:28px;height:28px;flex:none}
.order .on{font-weight:800;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.order .ot{font-size:10.5px;line-height:1.3;color:#5d4d6d;margin:2px 0 3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:27px}
.order .orow{display:flex;align-items:flex-end;gap:3px;margin-top:auto}
.req{position:relative;width:32px;height:32px;border-radius:9px;background:#efe3cc;flex:none}
.req img{width:100%;height:100%}
.req.ok{background:#d9f5c8}
.req.ok::after{content:"✓";position:absolute;right:-4px;bottom:-4px;width:15px;height:15px;border-radius:50%;background:var(--green);color:#fff;font-size:10px;font-weight:900;line-height:15px;text-align:center;border:1.5px solid #fff}
.rew{margin-left:auto;display:flex;align-items:center;font-size:11px;font-weight:800;color:#a8671a;white-space:nowrap}
.rew img{width:18px;height:18px}
.order .go{display:none;margin-left:auto;background:linear-gradient(#8ee36a,#46a63a);color:#fff;font-weight:900;font-size:12px;border-radius:10px;padding:6px 7px;box-shadow:0 3px 0 #2c7a28;white-space:nowrap}
.order.ready{border-color:#3f9a3a;background:#f2fff0;animation:readyPulse 1.4s ease-in-out infinite}
.order.ready .go{display:block}
.order.ready .rew{display:none}
@keyframes readyPulse{50%{box-shadow:0 0 0 4px rgba(95,185,74,.35),0 3px 0 rgba(75,58,90,.25)}}
.order.leave{animation:leave .45s forwards}
@keyframes leave{to{transform:translateY(-30px) scale(.8);opacity:0}}

/* Info bar */
#info{height:var(--info);flex:none;margin:6px 8px 0;background:var(--paper);border:3px solid var(--ink);border-radius:14px;display:flex;align-items:center;gap:8px;padding:0 6px;overflow:hidden}
#info .ii{width:34px;height:34px;flex:none}
#info .it{flex:1;min-width:0;line-height:1.25}
#info .it b{font-size:13px}
#info .it b em{font-style:normal;font-size:11px;color:var(--ink2);font-weight:700;margin-left:4px}
#info .it div{font-size:11px;color:#6d5d7d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#info .hint{font-size:12px;font-weight:700;color:#6d5d7d;flex:1;text-align:center}
.sbtn{flex:none;border-radius:10px;padding:6px 9px;font-weight:800;font-size:12px;background:#fff;border:2px solid var(--ink);display:flex;align-items:center;gap:2px;white-space:nowrap}
.sbtn img{width:16px;height:16px}
.sbtn.warn{background:#ffe1dc;border-color:var(--red);color:#b0342c}

/* Board */
#boardWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px}
#board{display:grid;grid-template-columns:repeat(7,var(--cell));grid-auto-rows:var(--cell);gap:var(--gap);padding:6px;border-radius:16px;
  background:#d9c3a0;border:3px solid var(--ink);box-shadow:inset 0 3px 0 rgba(0,0,0,.08);touch-action:none}
.cell{position:relative;border-radius:10px;background:#f2e4c8}
.cell:nth-child(2n){background:#ecdcbd}
.cell.sel{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--gold)}
.cell.hover{background:#fff4c8 !important;box-shadow:inset 0 0 0 3px var(--gold)}
.piece{position:absolute;inset:1px;display:grid;place-items:center;pointer-events:none}
.piece img{width:100%;height:100%;filter:drop-shadow(0 2px 0 rgba(75,58,90,.18))}
.piece .lv{position:absolute;right:1px;bottom:0;font-size:9px;font-weight:900;color:#fff;background:rgba(75,58,90,.72);border-radius:6px;padding:0 3px;line-height:12px}
.piece.lift{opacity:.25}
.cell.gen{background:radial-gradient(circle at 50% 45%,#fff6c8 0,#ffe08a 55%,#f2c25a 100%) !important;box-shadow:inset 0 0 0 2px #e0a42a}
.cell.gen .piece{animation:genIdle 2.4s ease-in-out infinite}
@keyframes genIdle{50%{transform:scale(1.05)}}
.cell.brick{background:#8a5a3a !important}
.cell.hint::after{content:"";position:absolute;inset:-3px;border-radius:12px;border:3px solid #fff;animation:ring 1s ease-in-out infinite;pointer-events:none}
@keyframes ring{0%{opacity:1;transform:scale(.92)}100%{opacity:0;transform:scale(1.18)}}
.dragimg{position:fixed;left:0;top:0;pointer-events:none;z-index:50;filter:drop-shadow(0 8px 8px rgba(0,0,0,.25))}
.fx{position:fixed;left:0;top:0;pointer-events:none;z-index:60}
.spark{position:fixed;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;pointer-events:none;z-index:60}
.float-num{position:fixed;z-index:61;font-weight:900;font-size:20px;color:#fff;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke;pointer-events:none}

/* Toast */
#toast{position:fixed;left:50%;top:calc(var(--hud) + 14px);transform:translateX(-50%);z-index:80;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px;width:92%;max-width:440px}
.tmsg{background:rgba(45,35,80,.92);color:#fff;font-size:13px;font-weight:700;padding:8px 14px;border-radius:14px;text-align:center;animation:tin .25s ease, tout .3s ease 2.2s forwards}
.tmsg.good{background:rgba(47,122,40,.94)}
.tmsg.gold{background:linear-gradient(#ffd96a,#f2b52e);color:#5a3a0a}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}

/* Layers: dialog, modal */
#layer{position:fixed;inset:0;z-index:70;pointer-events:none}
#layer > *{pointer-events:auto}
.shade{position:absolute;inset:0;background:rgba(30,20,50,.55);animation:fade .25s}
@keyframes fade{from{opacity:0}}
.dlg{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);width:calc(100% - 20px);max-width:500px;
  background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:14px 14px 12px 104px;min-height:122px;box-shadow:0 6px 0 rgba(0,0,0,.25);animation:pop .3s ease}
.dlg .face{position:absolute;left:10px;top:-34px;width:88px;height:88px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.2))}
.dlg .nm{font-weight:900;font-size:15px;margin-bottom:4px;color:#7a3f8f}
.dlg .tx{font-size:15px;line-height:1.55;min-height:46px;word-break:keep-all}
.dlg .nx{text-align:right;font-size:11px;color:var(--ink2);font-weight:700;margin-top:4px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
@keyframes pop{from{transform:translateX(-50%) scale(.9);opacity:0}}
.banner{position:absolute;left:50%;top:44%;transform:translateX(-50%);text-align:center;color:#fff;width:90%;animation:fade .5s}
.banner .k{font-size:14px;font-weight:800;letter-spacing:4px;color:var(--gold2)}
.banner .t{font-size:36px;font-weight:900;-webkit-text-stroke:2px var(--ink);paint-order:stroke;text-shadow:0 4px 0 rgba(0,0,0,.25);margin:4px 0}
.banner .r{font-size:14px;font-weight:700;opacity:.9}
.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:calc(100% - 32px);max-width:420px;max-height:84%;overflow:auto;background:var(--paper);
  border:3px solid var(--ink);border-radius:20px;padding:16px;box-shadow:0 6px 0 rgba(0,0,0,.25);animation:mpop .25s ease}
@keyframes mpop{from{transform:translate(-50%,-46%);opacity:0}}
.modal h2{margin:0 0 10px;font-size:19px;text-align:center}
.modal .x{position:absolute;right:10px;top:8px;width:32px;height:32px;border-radius:50%;font-size:20px;font-weight:900;color:var(--ink2)}
.mrow{display:flex;align-items:center;gap:10px;padding:9px;border-radius:14px;background:#fff;border:2px solid #e8dcc6;margin-bottom:8px}
.mrow img{width:46px;height:46px;flex:none}
.mrow .mt{flex:1;min-width:0}
.mrow .mt b{display:block;font-size:14px}
.mrow .mt small{font-size:11.5px;color:#6d5d7d}
.mrow.lock{opacity:.5}
.btn{border-radius:12px;padding:9px 14px;font-weight:900;font-size:14px;background:linear-gradient(#8ee36a,#46a63a);color:#fff;box-shadow:0 3px 0 #2c7a28;white-space:nowrap}
.btn.gold{background:linear-gradient(#ffe27a,#f2b52e);color:#5a3a0a;box-shadow:0 3px 0 #b07a1e}
.btn.gray{background:#ddd3c2;color:#5d4d6d;box-shadow:0 3px 0 #b8ab95}
.btn.red{background:linear-gradient(#ff8a7a,#e0574f);box-shadow:0 3px 0 #a3332c}
.btn:disabled{filter:grayscale(.8);opacity:.6}
.btn:active,.big:active{transform:translateY(2px)}
.mbtns{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.dex{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dex div{background:#fff;border:2px solid #e8dcc6;border-radius:12px;padding:6px;text-align:center;font-size:11px;font-weight:700}
.dex div.cur{border-color:var(--gold);background:#fff8dc}
.dex img{width:100%;max-width:64px;aspect-ratio:1}
.dex .unk img{filter:brightness(0) opacity(.25)}
.toggle{width:52px;height:30px;border-radius:15px;background:#cfc3ae;position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.toggle.on{background:var(--green)}
.toggle.on::after{left:25px}

/* Title */
#title{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 30%,#fff7d6 0,#cfe8ff 45%,#8fb8ec 100%);transition:opacity .5s}
#title.hide{opacity:0;pointer-events:none}
.tinner{width:100%;max-width:440px;text-align:center;padding:16px}
#titleArt{width:100%;max-width:400px;border-radius:24px;border:3px solid var(--ink);box-shadow:0 8px 0 rgba(45,35,80,.25);animation:floaty 4s ease-in-out infinite}
#logo{margin:18px 0 2px;font-size:46px;font-weight:900;letter-spacing:1px;color:#ffd24a;-webkit-text-stroke:3px var(--ink);paint-order:stroke;
  text-shadow:0 5px 0 rgba(45,35,80,.3);line-height:1.1}
.sub{margin:0 0 18px;font-weight:800;color:var(--ink);opacity:.8}
.tbtns{display:flex;flex-direction:column;align-items:center;gap:10px}
.big{width:220px;border-radius:18px;padding:14px;font-size:20px;font-weight:900;color:#fff;background:linear-gradient(#8ee36a,#46a63a);box-shadow:0 5px 0 #2c7a28;border:3px solid var(--ink)}
.ghost{font-size:13px;font-weight:700;color:var(--ink);opacity:.75;padding:6px;display:none}
.foot{margin-top:18px;font-size:12px;color:var(--ink);opacity:.7}

/* very short screens */
#app.compact .order .ot{display:none}
#app.compact .order{padding:4px 5px}
#app.compact #info .it div{display:none}
#app.compact .req{width:28px;height:28px}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <button id="btnBook" class="iconbtn" aria-label="이야기책"><img data-art="icon_book" alt=""></button>
    <div class="pill manna" id="pillManna">
      <img data-art="icon_manna" alt="">
      <div class="pilltxt"><b id="mannaTxt">60</b><small id="mannaSub">/60</small></div>
      <span id="mannaTimer"></span>
      <button class="plus" id="btnShop" aria-label="상점">+</button>
    </div>
    <div class="pill talent" id="pillTalent">
      <img data-art="icon_talent" alt="">
      <div class="pilltxt"><b id="talentTxt">0</b></div>
    </div>
    <button id="btnSet" class="iconbtn" aria-label="설정"><img data-art="icon_gear" alt=""></button>
  </header>
  <section id="stage">
    <img class="bg" id="stageBg" alt="">
    <div id="decor"></div>
    <div id="boss"><div class="hp"><i></i><span></span></div><img alt=""></div>
    <img id="rainbow" data-art="fx_rainbow" alt="">
    <div id="chLabel"></div>
    <div id="chProg"></div>
  </section>
  <section id="orders"></section>
  <section id="info"></section>
  <section id="boardWrap"><div id="board"></div></section>
</div>

<div id="title">
  <div class="tinner">
    <img id="titleArt" data-art="title_art" alt="">
    <h1 id="logo">바이블 머지</h1>
    <p class="sub">견습 천사의 성경 이야기</p>
    <div class="tbtns">
      <button id="btnStart" class="big">시작하기</button>
      <button id="btnNew" class="ghost">처음부터 새로 하기</button>
    </div>
    <p class="foot">같은 것 두 개를 합쳐 성경 속 사람들을 도와주세요</p>
  </div>
</div>

<div id="toast"></div>
<div id="layer"></div>

const URLS = {};
function art(name) {
  if (!URLS[name]) {
    const s = ART[name];

}

let S = null;

function chapter() { return D.chapters[Math.min(S.ch, D.chapters.length - 1)]; }
function completedCount() { return S.oi - S.orders.filter(o => o.story).length; }

/* ---------- manna ---------- */
function tickManna(now) {
  if (S.manna >= D.mannaMax) { S.regenAt = null; return 0; }
  if (!S.regenAt) S.regenAt = now + REGEN_MS;
  let gained = 0;
  while (S.regenAt <= now && S.manna < D.mannaMax) { S.manna++; gained++; S.regenAt += REGEN_MS; }
  if (S.manna >= D.mannaMax) S.regenAt = null;
  return gained;
}

}
function placeGenerator(g) {

  if (at < 0) {

}

/* ---------- chapters & orders ---------- */
function startChapter(i) {

}
function storyOrder(o) {

}

  const E = D.endless, chains = unlockedChains();

    const span = Math.min(E.maxLevel, maxLevel(c)) - E.minLevel + 1;

}

      const it = S.board[i];

}
function storyDone() { return S.oi >= chapter().orders.length && S.orders.length === 0; }

/* ---------- actions ---------- */
function useGenerator(idx) {
  const g = GEN[S.board[idx].g];
  const now = Date.now();
  tickManna(now);
  if (S.manna < 1) { Snd.sfx('error'); toast('만나가 부족해요! 잠시 기다리거나 상점을 이용해요'); openShop(); return; }
  const target = nearestEmpty(idx);
  if (target < 0) { Snd.sfx('error'); toast('보드가 가득 찼어요! 합치거나 팔아서 자리를 만들어요'); bump(cellEl(idx)); return; }
  let tot = 0; g.drops.forEach(d => tot += d.weight);
  let r = Math.random() * tot, chain = g.drops[0].chain;
  for (const d of g.drops) { if ((r -= d.weight) < 0) { chain = d.chain; break; } }
  const l = Math.random() < D.bonusLevelChance ? 2 : 1;
  S.manna--; tickManna(now);
  S.board[target] = { k: 'i', c: chain, l };
  const isNew = discover(chain, l);
  if (S.tut === 0) S.tut = 1;
  renderBoard(); renderHud(); renderOrders(); renderInfo();
  flyFromCell(target, idx);
  bump(cellEl(idx).firstChild);

  saveSoon();
}
function merge(from, to) {
  const a = S.board[from];
  S.board[from] = null;
  S.board[to] = { k: 'i', c: a.c, l: a.l + 1 };
  const isNew = discover(a.c, a.l + 1);
  if (S.tut === 1) S.tut = 2;
  sel = to;
  // break adjacent Babel bricks
  const [r, c] = rc(to), broken = [];
  [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]].forEach(([rr, cc]) => {
    if (rr < 0 || cc < 0 || rr >= ROWS || cc >= COLS) return;
    const j = rr * COLS + cc;
    if (S.board[j] && S.board[j].k === 'b') { S.board[j] = null; broken.push(j); }
  });
  renderAll();
  const p = cellEl(to).firstChild;
  if (p) p.animate([{ transform: 'scale(.6)' }, { transform: 'scale(1.25)' }, { transform: 'scale(1)' }], { duration: 360, easing: 'ease-out' });

    broken.forEach(j => { sparks(cellCenter(j), 10, ['#c98a5a', '#8a5a3a', '#e0a072']); });
    S.talents += broken.length * 3;
    S.boss.hp = Math.max(0, S.boss.hp - broken.length);

    floatText(cellCenter(broken[0]), '+' + broken.length * 3);

}

/* ---------- layout ---------- */
function layout() {
  const app = $('#app'), W = app.clientWidth, H = document.body.clientHeight || window.innerHeight;
  const gap = W < 360 ? 3 : 4;
  const fit = (orders, info, stageMin) => {
    const hud = 52, gaps = 6 * 4 + 12 + 12 + 6, fixed = hud + orders + info + gaps;
    const boardH = c => c * ROWS + gap * (ROWS - 1) + 18;
    const cellFor = st => Math.floor((H - fixed - st - 18 - gap * (ROWS - 1)) / ROWS);
    let cell = Math.min(64, Math.floor((W - 12 - 12 - 6 - gap * (COLS - 1)) / COLS));
    let stage = H - fixed - boardH(cell);
    if (stage < 130) { cell = Math.min(cell, Math.max(42, cellFor(130))); stage = H - fixed - boardH(cell); }
    if (stage < stageMin) { stage = stageMin; cell = cellFor(stageMin); }
    return { cell, stage: Math.min(stage, 200), orders, info };
  };
  let L = fit(114, 50, 96), compact = false;
  if (L.cell < 34) { L = fit(84, 42, 76); compact = true; L.cell = Math.max(24, L.cell); }
  app.classList.toggle('compact', compact);
  const r = document.documentElement.style;
  r.setProperty('--cell', L.cell + 'px'); r.setProperty('--gap', gap + 'px');
  r.setProperty('--stage', L.stage + 'px'); r.setProperty('--orders', L.orders + 'px'); r.setProperty('--info', L.info + 'px');
}

/* ---------- sound (WebAudio synth, no files) ---------- */
const Snd = {
  ctx: null, master: null, music: null, noise: null, timer: 0, step: 0, nextT: 0,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended' && !document.hidden) this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.55; this.master.connect(this.ctx.destination);
      this.music = this.ctx.createGain(); this.music.gain.value = 0; this.music.connect(this.master);
      const len = this.ctx.sampleRate * 0.4, buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      this.noise = buf;
      this.apply();
      this.nextT = this.ctx.currentTime + 0.1;
      this.timer = setInterval(() => this.schedule(), 200);
    } catch (e) { this.ctx = null; }
  },
  apply() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.music.gain.cancelScheduledValues(t);
    this.music.gain.setTargetAtTime(S && S.music ? 0.16 : 0, t, 0.4);
  },
  tone(f, dur, type, vol, when, slide, dest) {
    const c = this.ctx, t = c.currentTime + (when || 0);
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || this.master);
    o.start(t); o.stop(t + dur + 0.05);
  },
  burst(vol, dur, freq) {
    const c = this.ctx, t = c.currentTime;
    const s = c.createBufferSource(); s.buffer = this.noise;
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq || 1200;
    const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t + dur);
  },
  sfx(name, arg) {
    if (!S || !S.sound || !this.ctx || this.ctx.state !== 'running') return;
    const T = (...a) => this.tone(...a);
    switch (name) {
      case 'tap': T(660, .07, 'triangle', .1); break;
      case 'select': T(880, .06, 'sine', .08); break;
      case 'spawn': T(520, .14, 'triangle', .14, 0, 820); break;
      case 'merge': {
        const b = [523, 587, 659, 784, 880, 1047][Math.min(5, (arg || 2) - 1)];
        T(b, .2, 'triangle', .16); T(b * 1.26, .2, 'triangle', .1, .06); T(b * 1.5, .3, 'triangle', .12, .12); T(b * 2, .35, 'sine', .06, .18);
        break;
      }
      case 'discover': T(1175, .14, 'sine', .1); T(1568, .25, 'sine', .1, .09); break;
      case 'deliver': T(988, .09, 'square', .05); T(1319, .18, 'square', .05, .08); T(1760, .3, 'sine', .07, .16); break;
      case 'coin': T(1319, .08, 'square', .045); T(1760, .16, 'square', .045, .07); break;
      case 'error': T(220, .16, 'sawtooth', .06, 0, 160); break;
      case 'hit': T(150, .25, 'square', .12, 0, 60); this.burst(.25, .25, 900); break;
      case 'break': this.burst(.3, .3, 700); T(260, .15, 'square', .06, 0, 90); break;
      case 'fanfare': [523, 659, 784, 1047].forEach((f, k) => T(f, k === 3 ? .6 : .16, 'triangle', .15, k * .13)); T(1319, .6, 'sine', .07, .39); break;
    }
  },
  schedule() {
    if (!this.ctx || this.ctx.state !== 'running' || !S || !S.music) { if (this.ctx) this.nextT = this.ctx.currentTime + 0.1; return; }
    const beat = 60 / 76;
    const chords = [[261.6, 329.6, 392], [196, 246.9, 293.7], [220, 261.6, 329.6], [174.6, 220, 261.6]];
    const scale = [523.3, 587.3, 659.3, 784, 880, 1046.5];
    while (this.nextT < this.ctx.currentTime + 0.6) {
      const bar = Math.floor(this.step / 4) % 4, b = this.step % 4, t = this.nextT - this.ctx.currentTime;
      if (b === 0) chords[bar].forEach(f => this.pad(f / 2, beat * 4, t));
      if (Math.random() < 0.7) this.tone(pick(scale) * (Math.random() < .2 ? .5 : 1), beat * 0.9, 'triangle', 0.05, t, null, this.music);
      if (b === 2 && Math.random() < 0.5) this.tone(pick(scale), beat * 0.5, 'sine', 0.035, t + beat / 2, null, this.music);
      this.step++; this.nextT += beat;
    }
  },
  pad(f, dur, when) {
    const c = this.ctx, t = c.currentTime + when;
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.07, t + 0.8); g.gain.linearRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.music); o.start(t); o.stop(t + dur + 0.1);
  }
};

/* ---------- boot ---------- */
function fillStaticArt() { document.querySelectorAll('img[data-art]').forEach(i => i.src = art(i.dataset.art)); }
function begin(fresh) {
  if (fresh) { S = freshState(); try { localStorage.removeItem(SAVE_KEY); } catch (e) { } }
  $('#title').classList.add('hide');
  Snd.init(); Snd.apply();
  layout(); buildBoard();
  if (S.phase === 'new') { startChapter(0); renderAll(); showIntro(); }
  else if (S.phase === 'intro') { renderAll(); showIntro(); }
  else if (S.phase === 'outro') { renderAll(); showOutro(); }
  else {
    renderAll();
    const away = Date.now() - (S.lastSeen || Date.now());
    if (away > 120000) offlineGift(away, S._regenGain || 0);
  }
  delete S._regenGain;
  saveSoon();
}
function boot() {
  fillStaticArt();
  layout();
  const saved = load();
  S = saved || freshState();
  if (saved) {
    S._regenGain = tickManna(Date.now());
    $('#btnStart').textContent = '이어하기';
    $('#btnNew').style.display = 'block';
  }
  $('#btnStart').addEventListener('click', () => begin(false));
  $('#btnNew').addEventListener('click', e => {
    const b = e.currentTarget;
    if (b.dataset.arm) begin(true);
    else { b.dataset.arm = '1'; b.textContent = '저장된 진행이 지워져요. 한 번 더 누르세요'; }
  });
  $('#board').addEventListener('pointerdown', onDown);
  $('#btnShop').addEventListener('click', () => { Snd.init(); openShop(); });
  $('#pillManna').addEventListener('click', e => { if (e.target.id !== 'btnShop') { Snd.init(); openShop(); } });
  $('#btnBook').addEventListener('click', () => { Snd.init(); openBook(); });
  $('#btnSet').addEventListener('click', () => { Snd.init(); openSettings(); });
  window.addEventListener('resize', () => { layout(); if (cells.length) renderStage(); });
  document.addEventListener('visibilitychange', () => {
    if (!S) return;
    if (document.hidden) { save(); if (Snd.ctx) Snd.ctx.suspend(); hiddenAt = Date.now(); }
    else {
      if (Snd.ctx) Snd.ctx.resume();
      const g = tickManna(Date.now());
      if (cells.length) {
        renderHud();
        if (hiddenAt && Date.now() - hiddenAt > 120000 && (S.phase === 'play' || S.phase === 'free') && !$('#layer').children.length) offlineGift(Date.now() - hiddenAt, g);
      }
      hiddenAt = 0;
    }
  });
  window.addEventListener('pagehide', save);
  setInterval(() => {
    if (!S || !cells.length) return;
    const before = S.manna;
    tickManna(Date.now());
    if (S.manna !== before) { renderHud(); saveSoon(); } else renderTimer();
  }, 1000);
}
let hiddenAt = 0;
window.addEventListener('error', e => { try { toast('오류: ' + (e.message || e)); } catch (x) { } });
boot();
</script>
</body>
</html>
